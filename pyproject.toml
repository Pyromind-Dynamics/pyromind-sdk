[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyromind-sdk"
## todo update_version
version = "0.1.33.dev"
description = "Lightweight SDK stub for local development and testing of third-party nodes without the full platform codebase"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "PyroMind Team", email = "support@pyromind.ai"}
]
keywords = ["sdk", "node", "development", "stub", "yaml", "configuration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "urllib3>=1.26.0",
    "minio>=7.0.0",
    "aiohttp>=3.8.0",
    # aiohttp only decodes a "Content-Encoding: br" response when brotli is
    # importable. The async client therefore asks for "gzip, deflate" by
    # default (DEFAULT_ACCEPT_ENCODING in client/async_base.py) — aiohttp
    # 3.14's streaming br decoder is broken against brotli 1.2.0, which turned
    # every API call into "Can not decode content-encoding: br". This
    # dependency is what makes opting back in with PYROMIND_ACCEPT_ENCODING
    # work, and it covers edges that send br unsolicited.
    # Pinned by tests/pytest/test_runtime_dependencies.py — do not drop it.
    "brotli>=1.1.0",
    "kubernetes>=29.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "grpcio>=1.71.2",
    "protobuf>=5.29,<6",
]

[project.scripts]
pyromind = "pyromind_sdk.cli:main"
docker-rt = "pyromind_sdk.docker_rt.server:main"
docker_rt = "pyromind_sdk.docker_rt.server:main"
docker-rt-context = "pyromind_sdk.docker_rt.register_context:main"
pyromind-docker-uninstall = "pyromind_sdk.docker_rt.install_wrapper:uninstall_main"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "grpcio-tools>=1.71,<1.72",
]

[project.urls]
Homepage = "https://pyromind.ai/"
Documentation = "https://github.com/pyromind/pyromind-sdk"
Repository = "https://github.com/pyromind/pyromind-sdk"
Issues = "https://github.com/pyromind/pyromind-sdk/issues"

[tool.setuptools]
py-modules = ["pyromind_docker_sdk_timeout_boot"]
packages = [
    "pyromind_sdk",
    "pyromind_sdk.common",
    "pyromind_sdk.nodes",
    "pyromind_sdk.tests",
    "pyromind_sdk.client",
    "pyromind_sdk.client.workflow",
    "pyromind_sdk.docker_rt",
    "pyromind_sdk.docker_rt.api",
    "pyromind_sdk.docker_rt.backend",
    "pyromind_sdk.docker_rt.backend.kube",
    "pyromind_sdk.docker_rt.tests",
    "pyromind_sdk.rift",
    "pyromind_sdk.rift.pb",
]

[tool.setuptools.package-data]
pyromind_sdk = ["*.md"]
"pyromind_sdk.docker_rt" = ["*.md", "requirements.txt", "requirements-dev.txt"]
# rift-client is shipped as architecture-specific release binaries; build them
# with `pyromind_sdk/rift/client/make build-linux` before building the wheel.
"pyromind_sdk.rift" = [
    "README.md",
    "proto/*.proto",
    "bin/rift-client-linux-*",
    "bin/rift-client.sha256",
    "bin/rift-client.version",
]
"pyromind_sdk.examples" = ["*.yaml", "utils/*.py"]

# The wheel is runtime-only. Go sources and their tests build the binaries and
# are kept in the sdist (release checks read them), but docker-rt never needs
# them at run time.
[tool.setuptools.exclude-package-data]
"pyromind_sdk.rift" = [
    "client/*.go",
    "client/go.mod",
    "client/go.sum",
    "client/Makefile",
    "client/pb/*.go",
]

[tool.pytest.ini_options]
# Exclude test_yaml_nodes.py from pytest collection
# This file contains utility functions, not pytest test functions
python_files = ["test_*.py", "*_test.py"]
norecursedirs = []
testpaths = ["pyromind_sdk/tests"]
# Exclude test_yaml_nodes.py specifically
python_functions = ["test_*"]
# Asyncio configuration for async tests (use STRICT mode to avoid auto-detection)
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
