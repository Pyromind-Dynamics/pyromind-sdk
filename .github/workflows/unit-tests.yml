name: Unit Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: SDK + docker-rt unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r pyromind_sdk/docker_rt/requirements-dev.txt

      - name: SDK unit tests
        run: |
          pytest pyromind_sdk/tests/pytest \
            --ignore-glob='*integration*' \
            --ignore=pyromind_sdk/tests/pytest/test_all.py \
            --ignore=pyromind_sdk/tests/pytest/test_studio_example.py \
            --ignore=pyromind_sdk/tests/pytest/test_studio_nodes_flow.py \
            --ignore=pyromind_sdk/tests/pytest/test_sandbox_files.py \
            --ignore=pyromind_sdk/tests/pytest/test_profile_client.py \
            -q --tb=short

      - name: docker-rt unit tests
        run: |
          pytest pyromind_sdk/docker_rt/tests -q --tb=short
